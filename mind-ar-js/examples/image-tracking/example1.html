<!--
 Basic multi-target image tracking example (3 Targets)
-->
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/16/Stats.min.js"></script>
    <script src="../../src/image-target/aframe.js" type="module"></script>
   
    <style>
      body {
        margin: 0;
      }
      .example-container {
        overflow: hidden;
        position: absolute;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div class="example-container">
      <a-scene mindar-image="imageTargetSrc: ./assets/multi_targets.mind; showStats: true; maxTrack: 3;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
          <img id="card" src="./assets/card-example/card.png" />
          <img id="raccoonImg" src="./assets/band-example/raccoon.png" />
          <img id="bearImg" src="./assets/band-example/bear.png" />

          <a-asset-item id="avatarModel" src="./assets/card-example/softmind/scene.gltf"></a-asset-item>
          <a-asset-item id="raccoonModel" src="./assets/band-example/raccoon/scene.gltf"></a-asset-item>
          <a-asset-item id="bearModel" src="./assets/band-example/bear/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target 1: Business Card -> 3D Softmind Animated Avatar (Standing Upright) -->
        <a-entity mindar-image-target="targetIndex: 0">
          <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
          <a-gltf-model rotation="0 0 0" position="0 0 0.1" scale="0.005 0.005 0.005" src="#avatarModel"
            animation="property: position; to: 0 0.1 0.1; dur: 1200; easing: easeInOutQuad; loop: true; dir: alternate">
          </a-gltf-model>
        </a-entity>

        <!-- Target 2: Raccoon Artwork -> 3D Raccoon Character (Standing Upright & Facing Forward) -->
        <a-entity mindar-image-target="targetIndex: 1">
          <a-plane src="#raccoonImg" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
          <a-gltf-model rotation="0 0 0" position="0 -0.4 0.15" scale="0.05 0.05 0.05" src="#raccoonModel"
            animation="property: position; to: 0 -0.35 0.18; dur: 1400; easing: easeInOutQuad; loop: true; dir: alternate">
          </a-gltf-model>
        </a-entity>

        <!-- Target 3: Bear Artwork -> 3D Bear Character (Standing Upright & Facing Forward) -->
        <a-entity mindar-image-target="targetIndex: 2">
          <a-plane src="#bearImg" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
          <a-gltf-model rotation="0 0 0" position="0 -0.4 0.15" scale="0.05 0.05 0.05" src="#bearModel"
            animation="property: position; to: 0 -0.35 0.18; dur: 1400; easing: easeInOutQuad; loop: true; dir: alternate">
          </a-gltf-model>
        </a-entity>
      </a-scene>
    </div>
  </body>
</html>
